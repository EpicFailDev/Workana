<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Workana Accelerator Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }
    h1 { font-size: 14px; font-weight: 600; color: #f1f5f9; }
    .subtitle { font-size: 11px; color: #94a3b8; }
    .status-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .metric {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">⚡</div>
    <div>
      <h1>Workana Companion</h1>
      <div class="subtitle">Zero-Click Session Bridge</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Modo de Operação</span>
      <span class="status-badge" id="modeBadge">
        <span class="dot"></span> Zero-Click Ativo
      </span>
    </div>
    <div class="metric" id="lastSyncText">Última sincronização: verificando...</div>
    <div class="metric" id="cookieCountText">Cookies monitorados: --</div>
  </div>

  <button class="btn" id="syncBtn">
    <span>⚡ Sincronizar Agora</span>
  </button>

  <div class="footer">
    Workana Accelerator Enterprise Suite
  </div>

  <script src="popup.js"></script>
</body>
</html>
